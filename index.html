*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}

/* ---------- Logik ohne Oberfläche ---------- */
const SWAP={wird:"werden",werden:"wird",wirst:"wird",werde:"wird",werdet:"werden",wurde:"wurden",wurden:"wurde",ist:"sind",sind:"ist",bist:"ist",bin:"ist",seid:"sind"};
const TAIL=/[.?!“]+$/;
const keepCase=(from,to)=>from[0]===from[0].toUpperCase()?to[0].toUpperCase()+to.slice(1):to;
const swapWord=w=>keepCase(w,SWAP[w.toLowerCase()]||w);
function swapAux(s){const t=s.split(" ");const i=t.findIndex(x=>SWAP[x.replace(TAIL,"").toLowerCase()]);if(i<0)return s;const tail=(t[i].match(TAIL)||[""])[0];t[i]=swapWord(t[i].replace(TAIL,""))+tail;return t.join(" ");}
function swapPart(s,w){const t=s.split(" ");let i=t.length-1;if(t[i].replace(TAIL,"")==="worden")i--;const tail=(t[i].match(TAIL)||[""])[0];t[i]=w+tail;return t.join(" ");}
const parts=c=>[...c.a.matchAll(/\[(.+?)\]/g)].map(m=>m[1]);
const full=c=>c.a.replace(/[\[\]]/g,"");
const isGap=c=>!c.q;
const expected=c=>isGap(c)?parts(c).join(" "):c.a;
const shownSolution=c=>isGap(c)?parts(c).join(" … "):c.a;
function options(c,deck){
  let o;
  if(c.o) o=[isGap(c)?parts(c).join(" … "):c.a].concat(c.o);
  else if(deck.kind==="vocab") o=[parts(c)[0]].concat(c.d);
  else if(isGap(c)){
    const [aux,rest]=parts(c), j=(a,r)=>a+" … "+r;
    if(deck.kind==="zv"){
      const v=/ worden$/.test(rest), p=rest.replace(/ worden$/,"");
      o=[j(aux,rest), j(aux,v?p:p+" worden"), j(keepCase(aux,aux.toLowerCase()==="ist"?"wird":"werden"),p)];
    } else o=[j(aux,rest), j(swapWord(aux),rest), j(aux,swapPart(rest,c.w))];
  } else o=[c.a, c.x||swapAux(c.a), swapPart(c.a,c.w)];
  return o;
}
const strip=s=>s.replace(/[.,!?…„“"”'()]/g," ").replace(/\s+/g," ").trim();
const norm=s=>strip(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
const orderTokens=c=>full(c).split(/\s+/).filter(t=>t!=="…"&&t!=="–");

function nounsOf(c){
  const text=(c.q&&!c.o?c.q+" ":"")+full(c), out=[];
  text.split(/[\s\/]+/).forEach(t=>{const e=NOUNS[t.replace(/[.,!?…„“"”()]/g,"")];if(e&&!out.includes(e))out.push(e);});
  return out;
}
/* feste Kennung pro Karte, unabhängig von der Position im Kartensatz */
const hash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return h.toString(36);};
const cardKey=(deck,c)=>deck.id+":"+hash((c.q||"")+"|"+c.a);
const MODES=["write","order","choose"];
function cleanH(h){
  const out={};
  if(!h||typeof h!=="object") return out;
  for(const k of Object.keys(h)){
    if(!h[k]||typeof h[k]!=="object") continue;
    for(const m of MODES){
      const r=h[k][m];
      if(!r||typeof r.n!=="number") continue;
      (out[k]||(out[k]={}))[m]={n:Math.max(0,r.n|0),ok:Math.max(0,r.ok|0),f:r.f===true?true:r.f===false?false:null,t:+r.t||0,lo:!!r.lo,w:typeof r.w==="string"?r.w.slice(0,300):""};
    }
  }
  return out;
}
/* Zusammenführen: pro Karte und Übungsart gewinnt der Eintrag mit mehr Versuchen, bei Gleichstand der neuere */
function mergeH(base,inc){
  let total=0,taken=0;
  for(const k of Object.keys(inc)) for(const m of Object.keys(inc[k])){
    total++;
    const a=(base[k]||{})[m], b=inc[k][m];
    if(!a||b.n>a.n||(b.n===a.n&&b.t>a.t)){(base[k]||(base[k]={}))[m]=b;taken++;}
  }
  return {total,taken};
}

const KEY="c1-lernkarten-v2", OLD_KEY="c1-lernkarten-v1";

let H={};   // Verlauf: Kartenkennung -> Übungsart -> {n: Versuche, ok: richtige, f: erster Versuch richtig, t: Zeitpunkt, lo: letzter Versuch richtig, w: letzte falsche Antwort}
const st={screen:"cards",area:"v",deck:{v:"bonn",g:"zv"},mode:"write",filter:"all",pos:{},order:{},view:null,msg:"",wipe:false};

function save(){try{localStorage.setItem(KEY,JSON.stringify({v:2,ui:{area:st.area,deck:st.deck,mode:st.mode,filter:st.filter,pos:st.pos},h:H}));}catch(e){}}
(function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s){
      const u=s.ui||{};
      if(u.area==="v"||u.area==="g") st.area=u.area;
      if(MODES.includes(u.mode)) st.mode=u.mode;
      if(FILTERS.includes(u.filter)) st.filter=u.filter;
      for(const a of ["v","g"]) if(u.deck&&DECKS.some(d=>d.id===u.deck[a]&&d.area===a)) st.deck[a]=u.deck[a];
      if(u.pos&&typeof u.pos==="object") for(const k of Object.keys(u.pos)) st.pos[k]=u.pos[k]|0;
      H=cleanH(s.h);
      return;
    }
    // ältere Fassung: dort war nur gespeichert, welche Karten gelöst sind
    const o=JSON.parse(localStorage.getItem(OLD_KEY)||"null");
    if(o&&o.done) for(const k of Object.keys(o.done)){
      const [id,m]=k.split("/"), d=DECKS.find(x=>x.id===id);
      if(!d||!MODES.includes(m)) continue;
      for(const i of o.done[k]) if(d.cards[i]){const ck=cardKey(d,d.cards[i]);(H[ck]||(H[ck]={}))[m]={n:1,ok:1,f:null,t:Date.now(),lo:true,w:""};}
    }
  }catch(e){}
})();

const curDeck=()=>DECKS.find(d=>d.id===st.deck[st.area]);
const recOf=(deck,c,m)=>(H[cardKey(deck,c)]||{})[m||st.mode];
function matches(deck,c){
  const r=recOf(deck,c);
  if(st.filter==="wrong") return !!r&&r.n>0&&!r.lo;
  if(st.filter==="open") return !r||r.ok===0;
  if(st.filter==="old") return !r||Date.now()-r.t>7*864e5;
  return true;
}
/* Die Kartenliste wird nur neu gebildet, wenn Kartensatz, Übungsart oder Auswahl wechseln. So verschwindet eine Karte nicht, während du sie übst. */
function viewList(deck){
  const key=[deck.id,st.mode,st.filter].join("/");
  if(!st.view||st.view.key!==key){
    const base=(st.order[deck.id]||(st.order[deck.id]=deck.cards.map((_,i)=>i))).filter(i=>st.mode!=="order"||!deck.cards[i].noOrder);
    st.view={key,ids:base.filter(i=>matches(deck,deck.cards[i]))};
  }
  return st.view.ids;
}
function record(deck,c,correct,answer){
  const k=cardKey(deck,c), byMode=H[k]||(H[k]={}), r=byMode[st.mode]||(byMode[st.mode]={n:0,ok:0,f:null,t:0,lo:false,w:""});
  if(r.n===0) r.f=correct;
  r.n++; if(correct) r.ok++; else r.w=String(answer).slice(0,300);
  r.lo=correct; r.t=Date.now();
  save(); score(); histLine(deck,c);
}
function score(){
  const deck=curDeck(), cards=deck.cards.filter(c=>st.mode!=="order"||!c.noOrder);
  let ok=0,first=0;
  cards.forEach(c=>{const r=recOf(deck,c);if(r&&r.ok)ok++;if(r&&r.f===true)first++;});
  $("score").textContent="Gelöst: "+ok+" von "+cards.length+" · beim ersten Versuch richtig: "+first;
}
function histLine(deck,c){
  const r=recOf(deck,c);
  $("hist").textContent=r&&r.n?"Dein Verlauf für diese Karte: "+r.n+(r.n===1?" Versuch":" Versuche")+", davon "+r.ok+" richtig · zuletzt am "+fmt(r.t)+(r.lo?"":" · letzter Versuch falsch"):"Diese Karte hast du in dieser Übungsart noch nicht geübt.";
}

function gapHtml(c,fill){return esc(c.a).replace(/\[(.+?)\]/g,(m,p)=>'<span class="gap">'+(fill?p:"&nbsp;")+'</span>')+(c.inf?' <span class="inf">('+esc(c.inf)+')</span>':'');}
function head(c,deck){
  const how={write:isGap(c)?"Schreib, was in die Lücke gehört.":"Schreib den ganzen Satz.",order:"Bring die Wörter in die richtige Reihenfolge. Tippe ein Wort an, um es zu setzen oder wieder zu entfernen.",choose:"Wähle die richtige Antwort."}[st.mode];
  let h='<p class="task">'+esc(deck.task)+' '+how+'</p>';
  if(c.q) h+='<p class="sentence">'+esc(c.q)+'</p>';
  else if(st.mode!=="order") h+='<p class="sentence">'+gapHtml(c,false)+'</p>';
  else if(c.inf) h+='<p class="hint">'+(deck.hint||"Verb")+': '+esc(c.inf.replace(/^= /,""))+'</p>';
  return h;
}
function after(c,deck){
  let h='<div class="after"><p class="sentence">'+(isGap(c)?gapHtml(c,true):esc(c.a))+'</p>';
  if(deck.kind==="zv") h+='<p>'+(/worden/.test(c.a)?"Vorgangspassiv Perfekt: Der abgeschlossene Vorgang steht im Mittelpunkt.":"Zustandspassiv Präsens: Das Ergebnis besteht jetzt.")+'</p>';
  if(c.n&&!/^(der|die|das) \S+(, Plural| \(|$)/.test(c.n)) h+='<p>'+esc(c.n)+'</p>';
  const ns=nounsOf(c);
  if(ns.length) h+='<p><strong>Nomen:</strong></p><ul class="nouns">'+ns.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  return h+'</div>';
}

function render(){
  ["v","g"].forEach(a=>$("area-"+a).setAttribute("aria-selected",st.screen==="cards"&&st.area===a));
  $("area-s").setAttribute("aria-selected",st.screen==="stats");
  $("practice").hidden=st.screen!=="cards"; $("stats").hidden=st.screen!=="stats";
  if(st.screen==="stats"){renderStats();save();return;}
  const deck=curDeck(), l=viewList(deck);
  MODES.forEach(m=>$("mode-"+m).setAttribute("aria-selected",st.mode===m));
  $("deck").innerHTML=DECKS.filter(d=>d.area===st.area).map(d=>'<option value="'+d.id+'"'+(d.id===deck.id?" selected":"")+'>'+esc(d.title)+' ('+d.cards.length+')</option>').join("");
  $("filter").value=st.filter;
  $("src").textContent="Quelle: "+deck.src+(deck.own?". Die Lösungen stammen von Claude, nicht aus einem offiziellen Schlüssel.":".");
  score();
  if(!l.length){
    $("progress").textContent="Keine Karten in dieser Auswahl";
    $("prev").disabled=$("next").disabled=true; $("hist").textContent="";
    $("card").innerHTML='<p class="sentence">'+EMPTY[st.filter]+'</p><p class="hint">Wähle bei „Karten“ eine andere Auswahl.</p>';
    save(); return;
  }
  const pos=Math.max(0,Math.min(st.pos[deck.id]||0,l.length-1)); st.pos[deck.id]=pos;
  const c=deck.cards[l[pos]];
  $("progress").textContent="Karte "+(pos+1)+" von "+l.length;
  $("prev").disabled=pos===0; $("next").disabled=pos===l.length-1;
  histLine(deck,c); save();
  ({write:renderWrite,order:renderOrder,choose:renderChoose})[st.mode](c,deck);
}

function renderWrite(c,deck){
  const cands=[expected(c)].concat(c.alt||[]);
  let state="",msg="",show=false,val="";
  const draw=()=>{
    $("card").innerHTML=head(c,deck)+
      '<form id="f" class="actions"><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Deine Antwort" value="'+esc(val)+'"'+(state==="ok"?" disabled":"")+'>'+
      '<button class="primary" type="submit"'+(state==="ok"?" disabled":"")+'>Prüfen</button><button type="button" id="reveal">Lösung zeigen</button></form>'+
      '<p class="fb '+state+'" aria-live="polite">'+msg+'</p>'+
      (show||state==="ok"?after(c,deck):'')+
      (deck.kind==="vocab"?'<details><summary>Wortliste zeigen</summary><p>'+(deck.bank||[...new Set(deck.cards.map(x=>parts(x)[0].toLowerCase()))].sort((a,b)=>a.localeCompare(b,"de"))).map(esc).join(" · ")+'</p></details>':'')+
      (isGap(c)?'':'<p class="hint">Verglichen wird mit der Lösung. Eine andere Wortstellung kann auch richtig sein. ae, oe, ue und ss gelten als ä, ö, ü und ß.</p>');
    $("f").onsubmit=e=>{
      e.preventDefault(); val=$("answer").value;
      if(!val.trim()) return;
      const hit=cands.find(x=>norm(x)===norm(val));
      if(hit){state="ok";msg="Richtig."+(cands.some(x=>strip(x)===strip(val))?"":" Achte auf Großschreibung und Umlaute.");}
      else{state="no";msg="Noch nicht richtig. Versuch es noch einmal oder zeig die Lösung.";}
      record(deck,c,!!hit,val);
      draw();
    };
    $("reveal").onclick=()=>{val=$("answer").value;if(state!=="ok"&&!show)record(deck,c,false,"(Lösung angezeigt)");show=true;draw();};
    if(state!=="ok"&&(state||show)) $("answer").focus();
  };
  draw();
}

function renderOrder(c,deck){
  const target=orderTokens(c);
  let pool=shuffled(target.map((t,i)=>({t,i})));
  if(pool.length>1&&pool.every((p,k)=>p.i===k)) pool.reverse();
  let line=[],state="",show=false;
  const draw=()=>{
    const chip=(p,w)=>'<button class="word" data-w="'+w+'" data-i="'+p.i+'"'+(state==="ok"?" disabled":"")+'>'+esc(p.t)+'</button>';
    $("card").innerHTML=head(c,deck)+
      '<div class="line '+state+'">'+(line.length?line.map(p=>chip(p,"line")).join(""):'<span class="hint">Dein Satz entsteht hier.</span>')+'</div>'+
      '<div class="words">'+pool.map(p=>chip(p,"pool")).join("")+'</div>'+
      '<p class="fb '+state+'" aria-live="polite">'+(state==="ok"?"Richtig.":state==="no"?"Noch nicht richtig. Stell die Wörter um.":"")+'</p>'+
      (show||state==="ok"?after(c,deck):'')+
      '<div class="actions"><button id="check" class="primary"'+(pool.length||state==="ok"?" disabled":"")+'>Prüfen</button><button id="clear"'+(state==="ok"?" disabled":"")+'>Leeren</button><button id="reveal">Lösung zeigen</button></div>';
    $("card").querySelectorAll(".word").forEach(b=>b.onclick=()=>{
      const from=b.dataset.w==="pool"?pool:line, to=b.dataset.w==="pool"?line:pool;
      to.push(from.splice(from.findIndex(p=>p.i===+b.dataset.i),1)[0]); state=""; draw();
    });
    $("check").onclick=()=>{
      const got=line.map(p=>p.t).join(" ");
      const ok=got===target.join(" ")||!!(c.q&&(c.alt||[]).some(x=>x===got));
      state=ok?"ok":"no"; record(deck,c,ok,got); draw();
    };
    $("clear").onclick=()=>{pool=pool.concat(line);line=[];state="";draw();};
    $("reveal").onclick=()=>{if(state!=="ok"&&!show)record(deck,c,false,"(Lösung angezeigt)");show=true;draw();};
  };
  draw();
}

function renderChoose(c,deck){
  const o=options(c,deck), ok=[o[0]].concat(deck.kind==="vocab"&&!c.o?(c.alt||[]):[]), sh=shuffled([...new Set(o)]);
  const wrong=new Set(); let hit=null;
  const draw=()=>{
    $("card").innerHTML=head(c,deck)+
      '<div class="opts">'+sh.map((w,i)=>'<button class="word'+(hit===w?" ok":wrong.has(w)?" no":"")+'" data-i="'+i+'"'+(hit||wrong.has(w)?" disabled":"")+'>'+esc(w)+'</button>').join("")+'</div>'+
      '<p class="fb '+(hit?"ok":wrong.size?"no":"")+'" aria-live="polite">'+(hit?"Richtig.":wrong.size?"Das stimmt nicht. Versuch eine andere Antwort.":"")+'</p>'+
      (hit?after(c,deck):'');
    $("card").querySelectorAll(".word").forEach(b=>b.onclick=()=>{
      const w=sh[+b.dataset.i], good=ok.includes(w);
      if(good) hit=w; else wrong.add(w);
      record(deck,c,good,w);
      draw();
    });
  };
  draw();
}

/* ---------- Übersicht ---------- */
function renderStats(){
  let attempts=0,last=0; const solved=new Set(), errs=[]; let totalCards=0;
  const rows=DECKS.map(d=>{
    totalCards+=d.cards.length;
    const cells=MODES.map(m=>{
      const cards=d.cards.filter(c=>m!=="order"||!c.noOrder); let ok=0,first=0;
      cards.forEach(c=>{const r=recOf(d,c,m);if(!r)return;attempts+=r.n;last=Math.max(last,r.t);if(r.ok){ok++;solved.add(cardKey(d,c));}if(r.f===true)first++;if(r.n&&!r.lo)errs.push({d,c,m,r});});
      return {ok,first,n:cards.length};
    });
    return {d,cells};
  });
  errs.sort((a,b)=>b.r.t-a.r.t);
  const shown=errs.slice(0,30);
  let h='<section class="card"><h2>Dein Stand</h2>'+
    '<p>'+(attempts?attempts+(attempts===1?" Versuch":" Versuche")+" insgesamt · "+solved.size+" von "+totalCards+" Karten mindestens einmal gelöst · zuletzt geübt am "+fmt(last):"Du hast noch keine Karte geübt.")+'</p>'+
    '<div class="tbl"><table><thead><tr><th>Kartensatz</th>'+MODES.map(m=>'<th class="num">'+MODE_NAME[m]+'</th>').join("")+'</tr></thead><tbody>';
  ["v","g"].forEach(a=>{
    h+='<tr class="grp"><th colspan="4">'+AREA_NAME[a]+'</th></tr>';
    rows.filter(r=>r.d.area===a).forEach(r=>{h+='<tr><td>'+esc(r.d.title)+'</td>'+r.cells.map(x=>'<td class="num">'+x.ok+' / '+x.n+'<br><span class="small">'+x.first+' beim 1. Versuch</span></td>').join("")+'</tr>';});
  });
  h+='</tbody></table></div><p class="small">Gelöste Karten / Karten im Satz, darunter: beim ersten Versuch richtig.</p></section>';

  h+='<section class="card"><h2>Offene Fehler</h2>';
  if(!errs.length) h+='<p>Keine offenen Fehler. Hier erscheinen Karten, deren letzter Versuch falsch war.</p>';
  else{
    h+='<p>'+errs.length+(errs.length===1?" Karte, deren":" Karten, deren")+' letzter Versuch falsch war'+(errs.length>shown.length?" (die neuesten "+shown.length+")":"")+'.</p><ul class="errs">'+
      shown.map((e,i)=>'<li><span class="small">'+esc(e.d.title)+' · '+MODE_NAME[e.m]+' · '+fmt(e.r.t)+'</span>'+
        '<span>'+esc(e.c.q||e.c.a.replace(/\[.+?\]/g,"___"))+'</span>'+
        '<span>Deine Antwort: <strong>'+esc(e.r.w||"–")+'</strong></span>'+
        '<span>Richtig: <strong>'+esc(shownSolution(e.c))+'</strong></span>'+
        '<button data-e="'+i+'">Fehler in diesem Kartensatz üben</button></li>').join("")+'</ul>';
  }
  h+='</section>';

  h+='<section class="card"><h2>Verlauf sichern und einlesen</h2>'+
    '<p>Der Verlauf liegt im Browser dieses Geräts. Sichere ihn als Datei, bevor du das Gerät oder den Browser wechselst oder Browserdaten löschst.</p>'+
    '<div class="actions"><button id="exp-file" class="primary">Verlauf als Datei sichern</button><button id="exp-copy">Verlauf kopieren</button></div>'+
    '<p class="small">Startet kein Download, nutze „Verlauf kopieren“ und füge den Text in eine Datei oder Notiz ein.</p>'+
    '<p><label for="imp-file">Gesicherte Datei einlesen:</label><br><input type="file" id="imp-file" accept=".json,application/json"></p>'+
    '<p><label for="imp-text">Oder kopierten Verlauf hier einfügen:</label></p><textarea id="imp-text" spellcheck="false"></textarea>'+
    '<div class="actions"><button id="imp-go">Eingefügten Text einlesen</button></div>'+
    '<p class="small">Beim Einlesen wird zusammengeführt: Pro Karte und Übungsart bleibt der Eintrag mit mehr Versuchen erhalten. Nichts wird überschrieben, was neuer ist.</p>'+
    '<p class="fb" id="bk-msg" aria-live="polite">'+esc(st.msg)+'</p>'+
    '<div class="actions"><button id="wipe" class="danger">'+(st.wipe?"Wirklich den ganzen Verlauf löschen?":"Verlauf löschen")+'</button>'+(st.wipe?'<button id="wipe-no">Abbrechen</button>':'')+'</div></section>';
  $("stats").innerHTML=h;

  $("stats").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
    const e=shown[+b.dataset.e];
    st.area=e.d.area; st.deck[e.d.area]=e.d.id; st.mode=e.m; st.filter="wrong"; st.pos[e.d.id]=0; st.view=null; st.screen="cards"; render();
  });
  const dump=()=>JSON.stringify({app:"c1-lernkarten",v:2,exported:new Date().toISOString(),h:H});
  const say=m=>{st.msg=m;st.wipe=false;renderStats();};
  $("exp-file").onclick=()=>{
    try{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([dump()],{type:"application/json"}));
      a.download="c1-verlauf-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a); a.click(); a.remove();
      say("Die Datei wurde zum Download angeboten.");
    }catch(e){say("Der Download ist hier nicht möglich. Nutze „Verlauf kopieren“.");}
  };
  $("exp-copy").onclick=()=>{
    try{navigator.clipboard.writeText(dump()).then(()=>say("Der Verlauf ist kopiert."),()=>say("Kopieren ist hier nicht möglich."));}
    catch(e){say("Kopieren ist hier nicht möglich.");}
  };
  const take=txt=>{
    let obj; try{obj=JSON.parse(txt);}catch(e){return say("Das ist keine gültige Verlaufsdatei.");}
    if(!obj||typeof obj.h!=="object"||!obj.h) return say("Das ist keine gültige Verlaufsdatei.");
    const r=mergeH(H,cleanH(obj.h)); st.view=null; save();
    say(r.total+" Einträge gelesen, "+r.taken+" davon übernommen (neu oder mit mehr Versuchen).");
  };
  $("imp-file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>take(String(rd.result));rd.onerror=()=>say("Die Datei konnte nicht gelesen werden.");rd.readAsText(f);};
  $("imp-go").onclick=()=>{const t=$("imp-text").value.trim();if(t)take(t);else say("Füge zuerst den kopierten Verlauf in das Feld ein.");};
  $("wipe").onclick=()=>{
    if(!st.wipe){st.wipe=true;st.msg="";renderStats();return;}
    H={}; st.view=null; save(); say("Der Verlauf ist gelöscht.");
  };
  if(st.wipe) $("wipe-no").onclick=()=>{st.wipe=false;renderStats();};
}

["v","g"].forEach(a=>$("area-"+a).onclick=()=>{st.screen="cards";st.area=a;render();});
$("area-s").onclick=()=>{st.screen="stats";st.msg="";st.wipe=false;render();};
MODES.forEach(m=>$("mode-"+m).onclick=()=>{st.mode=m;render();});
$("deck").onchange=e=>{st.deck[st.area]=e.target.value;render();};
$("filter").onchange=e=>{st.filter=e.target.value;st.pos[curDeck().id]=0;st.view=null;render();};
$("prev").onclick=()=>{const d=curDeck();if(st.pos[d.id]>0){st.pos[d.id]--;render();}};
$("next").onclick=()=>{const d=curDeck();if(st.pos[d.id]<viewList(d).length-1){st.pos[d.id]++;render();}};
$("shuffle").onclick=()=>{const d=curDeck();st.order[d.id]=shuffled(st.order[d.id]||d.cards.map((_,i)=>i));st.pos[d.id]=0;st.view=null;render();};
$("restart").onclick=()=>{const d=curDeck();st.pos[d.id]=0;st.view=null;render();};
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
